<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICS 最终版项目架构图</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
    body { margin: 0; color: #1f2937; background: #f4f7fb; }
    header { padding: 24px 28px 12px; background: #ffffff; border-bottom: 1px solid #d9e2ef; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0; color: #526173; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 28px; background: #ffffff; border-bottom: 1px solid #d9e2ef; }
    button, select { border: 1px solid #b8c7d9; border-radius: 7px; background: #fff; padding: 8px 12px; font-size: 14px; cursor: pointer; }
    button:hover, select:hover { border-color: #4777b8; background: #f5f9ff; }
    .hint { margin-left: auto; font-size: 13px; color: #718096; }
    .stage { height: calc(100vh - 156px); min-height: 620px; margin: 18px; overflow: hidden; border: 1px solid #cbd8e6; border-radius: 12px; background: #fff; box-shadow: 0 5px 20px rgba(38, 66, 100, .08); }
    svg { width: 100%; height: 100%; display: block; user-select: none; touch-action: none; }
    svg.dragging { cursor: grabbing; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 0 28px 18px; background: #fff; color: #526173; font-size: 13px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 13px; height: 13px; border-radius: 3px; border: 1px solid currentColor; display: inline-block; }
  </style>
</head>
<body>
  <header>
    <h1>ICS（Intelligent Customer Service）最终版项目架构图</h1>
    <p>支持滚轮缩放、按钮缩放和拖拽平移；可切换总览、实时接待链路、归档统计链路。</p>
  </header>
  <div class="toolbar">
    <select id="diagramSelect" aria-label="选择架构图">
      <option value="overview">总览架构</option>
      <option value="realtime">实时接待链路</option>
      <option value="operations">归档、质检与统计链路</option>
    </select>
    <button data-action="zoomIn">放大</button>
    <button data-action="zoomOut">缩小</button>
    <button data-action="reset">重置视图</button>
    <button data-action="fit">适应窗口</button>
    <span class="hint">也可以使用鼠标滚轮缩放，按住鼠标拖动查看细节。</span>
  </div>
  <div class="stage"><svg id="architecture" role="img" aria-label="ICS 项目架构图"></svg></div>
  <div class="legend">
    <span><i class="swatch" style="background:#e8f1ff;color:#4a78c2"></i>渠道</span>
    <span><i class="swatch" style="background:#fff3d6;color:#c28a27"></i>Chatwoot</span>
    <span><i class="swatch" style="background:#e7f7ee;color:#3a9b65"></i>ICS 核心</span>
    <span><i class="swatch" style="background:#f3eafe;color:#8955c7"></i>数据与知识</span>
    <span><i class="swatch" style="background:#ffe8ee;color:#c95773"></i>人工接待</span>
    <span><i class="swatch" style="background:#e9f7f7;color:#2d9999"></i>归档与运营</span>
  </div>
  <script>
    const NS = "http://www.w3.org/2000/svg";
    const palette = {
      channel: ["#e8f1ff", "#4a78c2", "#17345f"],
      chatwoot: ["#fff3d6", "#c28a27", "#5c3a00"],
      ics: ["#e7f7ee", "#3a9b65", "#174c30"],
      data: ["#f3eafe", "#8955c7", "#45206b"],
      human: ["#ffe8ee", "#c95773", "#651e31"],
      archive: ["#e9f7f7", "#2d9999", "#124d4d"],
      ops: ["#f0f0f0", "#777777", "#333333"]
    };
    const svg = document.getElementById("architecture");
    const select = document.getElementById("diagramSelect");
    let current = "overview";
    let view = { x: 0, y: 0, w: 2200, h: 1200 };
    let base = { x: 0, y: 0, w: 2200, h: 1200 };
    let drag = null;

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&apos;"}[ch]));
    }
    function lines(x, y, values, size = 26, color = "#263445", weight = 400, anchor = "middle") {
      return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" font-weight="${weight}" fill="${color}">${values.map((v, i) => `<tspan x="${x}" dy="${i ? size + 8 : 0}">${esc(v)}</tspan>`).join("")}</text>`;
    }
    function box(x, y, w, h, title, body, kind, options = {}) {
      const [fill, stroke, color] = palette[kind];
      const radius = options.radius || 18;
      const titleSize = options.titleSize || 28;
      const bodySize = options.bodySize || 23;
      const bodyY = y + (options.bodyOffset || 106);
      return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${radius}" fill="${fill}" stroke="${stroke}" stroke-width="4"/><text x="${x + w / 2}" y="${y + 49}" text-anchor="middle" font-size="${titleSize}" font-weight="700" fill="${color}">${esc(title)}</text>${lines(x + w / 2, bodyY, body, bodySize, "#263445", 400)}</g>`;
    }
    function arrow(x1, y1, x2, y2, label = "", dashed = false) {
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2 - 12;
      return `<g><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#60758d" stroke-width="4" ${dashed ? 'stroke-dasharray="12 10"' : ''} marker-end="url(#arrow)"/>${label ? `<text x="${mx}" y="${my}" text-anchor="middle" font-size="20" fill="#526173">${esc(label)}</text>` : ""}</g>`;
    }
    function title(text, subtitle = "") {
      return `<text x="1100" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2937">${esc(text)}</text>${subtitle ? `<text x="1100" y="94" text-anchor="middle" font-size="20" fill="#60758d">${esc(subtitle)}</text>` : ""}`;
    }
    function defs() {
      return `<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#60758d"/></marker></defs>`;
    }

    function overview() {
      let s = defs() + title("ICS 最终版项目架构总览", "Chatwoot 会话底座 + ICS 智能决策 + 独立归档与运营服务");
      const y = 160, w = 300, h = 280;
      const xs = [70, 410, 750, 1090, 1430, 1770];
      s += box(xs[0], y, w, h, "客户渠道", ["微信", "产品 APP", "业务网页 / H5", "身份与渠道签名"], "channel");
      s += box(xs[1], y, w, h, "Chatwoot 底座", ["Website Widget / Inbox", "Contact / Conversation", "坐席工作台", "状态、标签、基础分配"], "chatwoot");
      s += box(xs[2], y, w, h, "ICS 核心服务", ["Webhook 验签与幂等", "会话状态与轮次", "FAQ-first + RAG", "转人工与 API 编排"], "ics");
      s += box(xs[3], y, w, h, "知识与业务数据", ["FAQ / 业务知识库", "向量库与重排模型", "会话记忆", "PostgreSQL 业务库"], "data");
      s += box(xs[4], y, w, h, "人工接待与提醒", ["在线坐席分配", "Windows 置顶弹窗", "声音与待处理提示", "浏览器插件打开会话"], "human");
      s += box(xs[5], y, w, h, "归档与运营", ["原始事件接收", "归档解析与查询", "质检与状态监管", "统计报表 / Excel"], "archive");
      s += arrow(xs[0] + w, y + 140, xs[1], y + 140, "用户进入");
      s += arrow(xs[1] + w, y + 140, xs[2], y + 140, "Webhook");
      s += arrow(xs[2] + w, y + 100, xs[3], y + 100, "读写");
      s += arrow(xs[2] + w, y + 190, xs[4], y + 190, "转人工");
      s += arrow(xs[1] + w, y + 240, xs[5], y + 240, "原始事件");
      s += box(300, 620, 1600, 280, "最终业务闭环", ["客户进线 → AI 首接 → FAQ / RAG 自动回答", "命中人工规则 → 坐席分配 → 强提醒 → 人工接待", "会话解决 → 开启下一轮 → 原始消息归档 → 查询、质检、统计"], "ops", { bodyOffset: 112, bodySize: 27 });
      s += arrow(920, y + h, 920, 620, "实时链路");
      s += arrow(1260, y + h, 1260, 620, "运营链路");
      s += box(470, 1010, 1260, 130, "部署与运行保障", ["Docker Compose · 主业务库与独立归档库 · 日志 · 健康检查 · Chatwoot 版本回归"], "ops", { bodyOffset: 88, bodySize: 24 });
      return s;
    }

    function realtime() {
      let s = defs() + title("实时接待链路", "从用户消息到 AI 回复或人工接管");
      const y = 170, w = 285, h = 220;
      const xs = [60, 390, 720, 1050, 1380, 1710];
      s += box(xs[0], y, w, h, "用户消息", ["微信 / APP / H5", "文字、图片、视频", "用户身份与渠道"], "channel");
      s += box(xs[1], y, w, h, "Chatwoot", ["创建或复用会话", "联系人与 Inbox", "坐席可见"], "chatwoot");
      s += box(xs[2], y, w, h, "ICS 接入层", ["签名校验", "入站过滤", "幂等登记", "异步入队"], "ics");
      s += box(xs[3], y, w, h, "会话控制", ["轮次判断", "AI 是否启用", "人工接管状态", "静音 / 解决重置"], "data");
      s += box(xs[4], y, w, h, "决策分流", ["转人工规则优先", "FAQ 命中判断", "敏感业务与置信度", "检索质量判断"], "ics");
      s += box(xs[5], y, w, h, "执行动作", ["自动回复", "分配坐席", "标签与私密备注", "会话状态更新"], "human");
      for (let i = 0; i < xs.length - 1; i++) s += arrow(xs[i] + w, y + 110, xs[i + 1], y + 110);
      s += box(270, 590, 360, 220, "FAQ 路径", ["BM25 匹配", "命中标准答案", "通过 Chatwoot API 回复"], "data");
      s += box(760, 590, 360, 220, "RAG 路径", ["LangGraph 编排", "向量召回 / 可选精排", "云端模型生成回复"], "ics");
      s += box(1250, 590, 360, 220, "人工路径", ["在线状态与容量", "历史优先 / 轮询", "成功分配后触发提醒"], "human");
      s += arrow(xs[4] + 142, y + h, 450, 590, "自动回答");
      s += arrow(xs[4] + 142, y + h, 940, 590, "FAQ 未命中");
      s += arrow(xs[4] + 142, y + h, 1430, 590, "需要人工");
      s += arrow(630, 700, 1710, y + h, "公开回复");
      s += arrow(1120, 700, 1710, y + h, "公开回复");
      s += arrow(1610, 700, 1710, y + h, "提醒 + 分配");
      s += box(420, 950, 1360, 130, "人工接管后的约束", ["后续用户消息继续记录但停止 AI 自动回复；坐席回复不触发 AI 循环；会话解决后释放当前人工轮次。"], "ops", { bodyOffset: 88, bodySize: 23 });
      return s;
    }

    function operations() {
      let s = defs() + title("归档、质检与统计链路", "实时接待与历史运营数据分离，归档事件作为可重建证据");
      s += box(70, 160, 350, 240, "Chatwoot Webhook", ["客户消息", "人工回复", "机器人消息", "状态 / 分配事件"], "chatwoot");
      s += box(520, 160, 350, 240, "归档接收器", ["专用账户级 Webhook", "签名校验", "原始事件入库", "持久化解析任务"], "archive");
      s += box(970, 160, 350, 240, "原始事件库", ["保存完整 payload", "不按 AI 入站条件过滤", "支持重复投递去重"], "data");
      s += box(1420, 160, 350, 240, "解析 Worker", ["消息与版本", "会话与咨询轮次", "评价与分配索引", "可重建查询数据"], "archive");
      s += arrow(420, 280, 520, 280, "事件");
      s += arrow(870, 280, 970, 280, "追加");
      s += arrow(1320, 280, 1420, 280, "异步解析");
      s += box(220, 620, 350, 240, "归档查询", ["按用户、轮次、时间", "按渠道、接待类型、坐席", "查看完整历史与版本"], "archive");
      s += box(720, 620, 350, 240, "客服状态监管", ["每分钟采样", "在线 / 忙碌 / 离线", "全天时间轴", "45 天状态保留"], "human");
      s += box(1220, 620, 350, 240, "质检与统计", ["人工质检", "AI 质检预留", "询盘与渠道趋势", "首响、回复、流单、评分"], "archive");
      s += box(1720, 620, 350, 240, "管理后台", ["质检复核", "报表查询", "Excel 导出", "FAQ / 知识库维护"], "data");
      s += arrow(1595, 400, 395, 620, "索引");
      s += arrow(1595, 400, 895, 620, "状态采样");
      s += arrow(1595, 400, 1395, 620, "聚合");
      s += arrow(570, 740, 1720, 740, "查询");
      s += arrow(1070, 740, 1720, 740, "查询");
      s += arrow(1570, 740, 1720, 740, "查询 / 导出");
      s += box(420, 1010, 1360, 130, "数据边界", ["ICS 业务库保存在线处理状态与记忆；独立归档库保存原始证据与运营索引；查询和统计不参与实时 AI 决策。"], "ops", { bodyOffset: 88, bodySize: 23 });
      return s;
    }

    const diagrams = { overview: overview, realtime: realtime, operations: operations };
    function render(name) {
      current = name;
      const content = diagrams[name]();
      svg.innerHTML = `<g id="viewport">${content}</g>`;
      base = name === "overview" ? { x: 0, y: 0, w: 2200, h: 1200 } : { x: 0, y: 0, w: 2200, h: 1200 };
      view = { ...base };
      applyView();
    }
    function applyView() {
      svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
    }
    function zoom(factor, centerX = view.x + view.w / 2, centerY = view.y + view.h / 2) {
      const nw = Math.max(350, Math.min(base.w * 3, view.w * factor));
      const nh = Math.max(220, Math.min(base.h * 3, view.h * factor));
      view.x = centerX - (centerX - view.x) * (nw / view.w);
      view.y = centerY - (centerY - view.y) * (nh / view.h);
      view.w = nw; view.h = nh; applyView();
    }
    function reset() { view = { ...base }; applyView(); }
    function fit() { reset(); }
    document.querySelectorAll("button[data-action]").forEach((button) => button.addEventListener("click", () => {
      const action = button.dataset.action;
      if (action === "zoomIn") zoom(.8);
      if (action === "zoomOut") zoom(1.25);
      if (action === "reset" || action === "fit") reset();
    }));
    select.addEventListener("change", () => render(select.value));
    svg.addEventListener("wheel", (event) => {
      event.preventDefault();
      const point = svg.createSVGPoint(); point.x = event.clientX; point.y = event.clientY;
      const transformed = point.matrixTransform(svg.getScreenCTM().inverse());
      zoom(event.deltaY < 0 ? .88 : 1.14, transformed.x, transformed.y);
    }, { passive: false });
    svg.addEventListener("pointerdown", (event) => {
      svg.setPointerCapture(event.pointerId); svg.classList.add("dragging");
      drag = { x: event.clientX, y: event.clientY, viewX: view.x, viewY: view.y };
    });
    svg.addEventListener("pointermove", (event) => {
      if (!drag) return;
      const scaleX = view.w / svg.clientWidth;
      const scaleY = view.h / svg.clientHeight;
      view.x = drag.viewX - (event.clientX - drag.x) * scaleX;
      view.y = drag.viewY - (event.clientY - drag.y) * scaleY;
      applyView();
    });
    svg.addEventListener("pointerup", () => { drag = null; svg.classList.remove("dragging"); });
    svg.addEventListener("pointercancel", () => { drag = null; svg.classList.remove("dragging"); });
    render("overview");
  </script>
</body>
</html>
