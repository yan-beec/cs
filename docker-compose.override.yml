services:
  ics-agent:
    # 本地开发时直接使用工作区源码，修改 Python 文件后自动重载。
    volumes:
      - ./ics_agent:/app/ics_agent:ro
      - ./reminder:/app/reminder:ro
      - ./quality:/app/quality:ro
      - ./statistics:/app/statistics:ro
      - ./support-chat.html:/app/support-chat.html:ro
      - ./knowledge_base_in/parse_documents.py:/app/knowledge_base_in/parse_documents.py:ro
      - ./knowledge_base_in/build_chromadb.py:/app/knowledge_base_in/build_chromadb.py:ro
    command:
      [
        "python",
        "-m",
        "ics_agent.app.serve",
        "--reload",
        "--reload-dir",
        "/app/ics_agent",
        "--reload-dir",
        "/app/reminder",
        "--reload-dir",
        "/app/quality",
        "--reload-dir",
        "/app/statistics"
      ]
